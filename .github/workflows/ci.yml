name: CI Quality & Security Gates (ISO 25010 / ISO 27001)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    name: Secret Scanning & Security (ISO 27001)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality Assurance & Build (ISO 25010)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Run Automated Unit Tests (ISO 25010)
        run: npm test

      - name: Next.js Production Build
        run: npm run build

      - name: Report Failure as Incident Issue (ISO 27001 / ISO 42001)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [CI Failure] Falha na branch ${{ github.ref_name }} (Run #${{ github.run_number }})" \
            --body "### 🚨 Incidente de CI Detectado (ISO/IEC 27001 & ISO/IEC 42001)
          - **Branch:** \`${{ github.ref_name }}\`
          - **Commit:** \`${{ github.sha }}\`
          - **Execução:** [Run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Workflow:** \`${{ github.workflow }}\`

          #### 🛠️ Instruções para Auto-Healing (Agente IA / Engenharia):
          1. Execute localmente para inspecionar os logs exatos:
             \`\`\`bash
             npm run ci:diagnose
             # ou diretamente:
             gh run view ${{ github.run_id }} --log-failed
             \`\`\`
          2. Reproduza e valide as correções:
             \`\`\`bash
             npm run typecheck
             npm run lint
             npm test
             npm run build
             \`\`\`
          3. Suba o commit corretivo na branch \`${{ github.ref_name }}\` e feche esta issue com a label \`auto-healed\`." \
            --label "ci-failure,bug"
